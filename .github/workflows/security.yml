name: security alerts

# Code-scanning, Dependabot and secret-scanning alerts were seen only by
# whoever opened the Security tab: on 2026-10-18 sixteen code-scanning alerts
# were open and untriaged, two of them real (#1063). This job files an item
# of the queue for every group of open alerts that no open issue of the
# repository's own already mentions, labelled by severity so next.py can
# place it, and the loop
# triages it from there (AF-121). It notices and files; it never dismisses
# an alert and never changes code. .github/scripts/security_alarm.py says
# the rest.
#
# Weekly, at a minute nobody else picked (AF-01), and after each CodeQL run
# on main finishes, so an alert a push raises can be filed the same day.
# CodeQL here is GitHub's default setup, listed among this repository's
# workflows as `CodeQL` (dynamic/github-code-scanning/codeql); no run of
# this file has yet shown that workflow_run fires for it, so the weekly
# schedule is the floor either way. workflow_run runs this file as it is on
# main, and the `branches` filter keeps it to runs on main.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so two runs close together cannot both find a group
# unfiled and both open an issue for it.
concurrency:
  group: security-alerts
  cancel-in-progress: false

jobs:
  # Two tokens. The workflow's own, with the two scopes it needs:
  # security-events to read the code-scanning alerts, issues to file them.
  # And one minted from the refresh GitHub App, narrowed to reading the
  # Dependabot and secret-scanning alerts, which GITHUB_TOKEN was refused
  # (HTTP 403 on the first run, 2026-10-23, and every run since) (AF-124).
  # The App token reads those two kinds and nothing else; it never writes.
  # A kind neither token may read fails the step at the end, which
  # security_alarm.py prefers to a watch that reports nothing open because
  # it cannot look. No npm: it checks out one file and runs it, and runs
  # as it is on main, never a pull request's copy.
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/security_alarm.py
          sparse-checkout-cone-mode: false

      # Last before the one step that uses it, and revoked when the job
      # ends. A mint that fails - the App lacking either permission, say -
      # does not stop the job: the script then names both kinds unreadable,
      # still files the code-scanning alerts, and fails the step.
      - name: Mint a token that reads Dependabot and secret-scanning alerts
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          permission-vulnerability-alerts: read
          permission-secret-scanning-alerts: read

      - name: File the open alerts nobody has
        env:
          ALERTS_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -B .github/scripts/security_alarm.py
