name: release the artefacts

# WHY THIS EXISTS
#     f1_database.json is a 21 MB export of a 20 MB database, and neither
#     delta-compresses: a refresh that changed one row used to write a whole
#     new copy of both into git history. Four commits in a single session took
#     .git from 13 MB to 34 MB, and the harvest refreshes every Monday.
#
#     So the full export is no longer committed. Anything consuming it still
#     needs a stable place to fetch it from, and that is what a release is
#     for — a tagged, dated, checksummed copy of exactly what that version of
#     the sources builds, rather than a file whose every intermediate state is
#     kept forever.
#
# Tag a version and push it, or run this by hand:
#
#     git tag v2.15 && git push origin v2.15
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # meta.version comes from VERSION in build.py, so a tag that disagrees
      # with it publishes artefacts that misreport their own identity. There
      # is nothing downstream to catch that, so catch it here, before the
      # build burns twenty minutes.
      - name: The tag must match VERSION
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          version=$(python3 -c 'import build; print(build.VERSION)')
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match VERSION $version (expected v$version)"
            exit 1
          fi
          echo "tag $tag matches VERSION $version"

      # Rebuilt from data/*.py rather than taken from the checkout, and gated
      # on the checks: a release that carries a database which failed its own
      # verification is worse than no release.
      - name: Rebuild
        run: python3 build.py

      - name: Unit-test the loaders
        run: python3 -m unittest discover -s tests

      - name: Verify
        run: python3 verify.py

      - name: Export
        run: python3 export_json.py --compat

      - name: Compress the export
        run: gzip -9 -k f1_database.json

      # The bulk export, for readers who want the data rather than a page of
      # it. pyarrow is installed HERE and nowhere else: the build stays
      # standard-library-only, so `git clone && make all` still needs nothing,
      # and only the job that publishes needs a Parquet writer.
      - name: Install the Parquet writer
        run: pip install pyarrow

      - name: Export to Parquet
        run: |
          python3 tools/parquet_export.py
          zip -j -9 f1-parquet.zip parquet/*.parquet
          unzip -l f1-parquet.zip | tail -1

      # The database is reproducible from its sources, so a digest is a real
      # identity for it rather than a timestamp. Anyone can rebuild and compare.
      #
      # Digest the files that are actually uploaded, which is why this runs
      # after the compression: SHA256SUMS used to carry a digest for the
      # uncompressed f1_database.json while the release shipped the .gz, so
      # the one file a reader could not check was the one they received.
      - name: Checksums
        run: |
          sha256sum f1.db f1-geometry.db f1_database.json.gz f1_compat.json \
            f1-parquet.zip schema.sql > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            f1.db
            f1-geometry.db
            f1_database.json.gz
            f1_compat.json
            f1-parquet.zip
            schema.sql
            SHA256SUMS
          body: |
            Built from the sources at this tag, and published only after
            `verify.py` passed.

            | File | What it is |
            |---|---|
            | `f1.db` | The SQLite database. Open it with any SQLite client. |
            | `f1-geometry.db` | Circuit centrelines, © OpenStreetMap contributors under ODbL 1.0. A separate file so its share-alike does not reach the rest — see below. `circuit_geometry` in `f1.db` is deliberately empty. |
            | `f1_database.json.gz` | Full JSON export of every table. Not kept in git — it is 21 MB and regenerates in about a second with `make export`. |
            | `f1_compat.json` | JSON in the original v1 key layout. |
            | `f1-parquet.zip` | Every table as Parquet, one file each — including the two the JSON export omits for size. Columnar and compressed: pandas, polars and DuckDB read it directly. |
            | `schema.sql` | The schema, commented. |
            | `SHA256SUMS` | Digests. The build is reproducible, so you can check these by rebuilding. |

            Data is CC BY-SA 4.0. Circuit geometry is © OpenStreetMap
            contributors under ODbL 1.0, and ships as its own file rather
            than inside `f1.db` or the JSON export: two databases distributed
            alongside each other are a Collective Database under ODbL, so the
            share-alike follows `f1-geometry.db` alone. Take one, take both,
            and the obligation follows the file it belongs to.
            See `ATTRIBUTION.md`.

            Nobody publishes Formula One race timing under a licence that
            permits passing it on, so this database holds none: `laps`,
            `stints`, `race_timing` and `race_control_messages` are empty on
            purpose, and everything that is here may be passed on under the
            licence shown beside it. That is about the licences on offer
            rather than about what anyone may lawfully do — FOM and its
            licensees redistribute timing every weekend — and about race
            timing: the qualifying table holds lap times, which F1DB
            publishes under CC BY 4.0.
            `docs/TIMING-ARCHITECTURE.md` is that decision in full.

            **Stable links.** Every asset above is also reachable at a URL
            that always points at the newest release, so a script does not
            need updating each time:

            ```
            https://github.com/Alex-Farley/formula-1-data/releases/latest/download/f1.db
            https://github.com/Alex-Farley/formula-1-data/releases/latest/download/f1-parquet.zip
            ```

            Swap `latest` for a tag (`v2.19`) to pin a version instead.

            The Parquet bundle is also served from the site itself:

            ```
            https://lapledger.org/f1-parquet.zip
            ```

            That copy is rebuilt on every deploy from the database the site
            is serving, so it is never older than the pages beside it. The
            release asset above is pinned to this tag; use whichever suits —
            the newest data, or a version you can cite.
