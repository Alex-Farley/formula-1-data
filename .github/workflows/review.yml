name: review

# An independent read of every pull request, against the conventions this
# repository enforces rather than against generic good practice.
#
# WHY THIS IS SEPARATE FROM ci.yml: `ci.yml` answers "does the build still
# pass". Most of what goes wrong here passes the build — a source nobody
# classified is caught, but a cross-check that does not constrain the value it
# guards is not, and neither is a hand-resolved artefact conflict, a bare <img>
# bypassing the Commons credit, or a tidying pass that erases a declared
# deviation. Those need reading, so this reviews and comments; it never gates.
#
# It reviews with the three agents in .claude/agents/, which are the same
# definitions used from a terminal. One place to change a rule, two places it
# takes effect.
on:
  pull_request:
    # `labeled` is here so that adding the label below starts a review on a
    # pull request that is already open. The rest are here so that a review,
    # once asked for, keeps up with the branch.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# NO workflow_dispatch, deliberately. It was here, and every manual run failed
# in under a second:
#
#     track_progress is only supported for events: pull_request, issues,
#     issue_comment, pull_request_review_comment, pull_request_review.
#     Current event: workflow_dispatch
#
# Dropping `track_progress` below would not rescue it. A manual run has no
# pull request — the job log shows PR_NUMBER empty — so `use_sticky_comment`
# has nowhere to post and the prompt asks for a review of a diff that does not
# exist. Nor does the draft guard stop it: on a dispatch
# `github.event.pull_request.draft == false` reads `null == false`, which
# GitHub coerces to `0 == 0` and runs the job anyway. There is no configuration
# of this file under which a manual run produces a review, so the trigger only
# ever produced a red check.
#
# To get a review again, push to the branch or reopen the pull request.

# Read the code, write the review. Nothing here commits, so `contents` stays
# read — the same reasoning ci.yml records for its own token.
permissions:
  contents: read
  pull-requests: write
  # anthropics/claude-code-action authenticates by exchanging a GitHub OIDC
  # token, and a workflow cannot mint one without this. Without it the action
  # retries three times and fails with "Could not fetch an OIDC token", which
  # is what the first run of this file did.
  id-token: write

# A review of the commit before last is noise. Supersede it.
concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # THIS REVIEW IS OPT-IN, BY THE `ci-review` LABEL. It used to run on every
    # pull request, and three things were true of it at once (2026-09-16):
    #
    #   1. It duplicated the review the backlog loop already runs before it
    #      merges, using the SAME three agent definitions in .claude/agents/.
    #   2. CLAUDE.md instructed the loop to ignore its result and run those
    #      agents locally — so it was a review nobody read.
    #   3. A green check was not evidence a review happened: on PR #312 it
    #      reported SUCCESS with its sticky comment stopping two steps short
    #      of posting findings. AF-27 (#313) made green mean posted: the last
    #      step of this job now goes red unless the findings are on the pull
    #      request for the head commit this run reviewed.
    #
    # It also fired on `synchronize`, so every fix push during a review round
    # started another full run: four on the AF-29 pull request, four on
    # AF-31/AF-30. That is the largest line of token spend in the loop that
    # bought nothing.
    #
    # WHAT DID NOT CHANGE: this never gated a pull request and still does not,
    # and the loop's own rule — a fresh independent review from .claude/agents/
    # before every merge — is untouched and is what actually protects `main`.
    # Removing the trigger removes a duplicate, not a control. Label a pull
    # request `ci-review` when you want a second opinion from CI; the review
    # then keeps up with the branch until the label comes off.
    # Recorded as D-28 in docs/DECISIONS.md.
    #
    # A draft is a work in progress and reviewing one is an interruption.
    if: >-
      github.event.pull_request.draft == false
      && contains(github.event.pull_request.labels.*.name, 'ci-review')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The review needs the base branch to diff against, and the reasons
          # in the history: several conventions here are only legible from the
          # commit that introduced them.
          fetch-depth: 0

      # WITHOUT A KEY THIS SKIPS RATHER THAN FAILS. A review is an addition to
      # the pull request, never a gate on it, so a fork, a Dependabot branch or
      # a repository whose secret has not been set must still go green. The
      # notice says why, because a step that goes quiet when unconfigured is
      # one nobody trusts — the same lesson the Parquet build step taught.
      - name: Is the review configured
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN is set, so the review was skipped. Add one under Settings, Secrets and variables, Actions."
          fi

      # WILL THE ACTION REFUSE — established before it is asked, rather than
      # read back out of its log afterwards. It reviews only when this file is
      # byte-identical to the copy on the default branch (the Review step below
      # explains why), so running that same comparison here predicts the
      # refusal exactly. That is what lets the summary at the end of this job
      # name which outcome happened instead of leaving them indistinguishable.
      - name: Will the review be refused
        id: validation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if git diff --quiet "refs/remotes/origin/${DEFAULT_BRANCH}" -- .github/workflows/review.yml; then
            echo "edited=false" >> "$GITHUB_OUTPUT"
          else
            echo "edited=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This pull request edits .github/workflows/review.yml, so the action will decline to review it. That is the rule stopping a pull request from rewriting the reviewer that judges it, and it is not a failure."
          fi

      # THIS STEP CANNOT RUN ON THE PULL REQUEST THAT INTRODUCES IT, and will
      # not run on one that edits this file either. The action refuses unless
      # the workflow is byte-identical to the copy on the default branch —
      # otherwise a pull request could rewrite the reviewer that judges it.
      # It reports that as
      #
      #     Workflow validation failed. The workflow file must exist and have
      #     identical content to the version on the repository's default branch.
      #
      # and then exits SUCCESS, so the check goes green having reviewed
      # nothing and said nothing on the pull request. That is expected and
      # correct, but on its own it is indistinguishable from a working review
      # that found no problems — which is why the last step of this job writes
      # to the run summary which of the two it was. It starts working on the
      # first pull request opened after this file reaches main.
      - name: Review
        id: review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One comment, rewritten each push, rather than a new one per commit.
          use_sticky_comment: "true"
          track_progress: "true"
          # Read-only. A reviewer that can edit is a contributor, and this one
          # has not been asked to contribute. `verify.py`, `audit.py` and the
          # unit tests are allowed because a finding backed by a failing check
          # is worth more than one backed by an argument, and all three are
          # stdlib-only so this job installs nothing to get them. Two are
          # deliberately absent: `build.py`, because it overwrites the committed
          # database and the state of that file is itself evidence, and the
          # front end's tests, because they need `npm ci` and a browser that
          # this job does not have — `ci.yml` runs those.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(python3 verify.py:*),Bash(python3 audit.py:*),Bash(python3 -m unittest:*)"
          prompt: |
            Review this pull request against the conventions of THIS repository.
            They are not style preferences: each one exists because something
            went wrong without it, and a generic review will miss all of them
            while proposing things that have already been measured and rejected.

            Read CLAUDE.md first. Then delegate to the three project agents in
            .claude/agents/, each of which carries its own checklist and its own
            list of what not to propose:

              - licence-reviewer        — whether the change could publish a row
                                          this project has no right to pass on
              - data-integrity-reviewer — the build's structural invariants
              - frontend-reviewer       — anything under web/

            Send each agent only the part of the diff it covers, and skip an
            agent whose files the diff does not touch. If you cannot delegate to
            an agent, read its file and apply its checklist yourself — the
            checklists are the point, not the mechanism.

            Then report:

            - Post ONE review comment. Order findings by consequence, worst
              first, each with the file, the line, the rule it breaks, and the
              failure it would produce — concretely.
            - Mark each finding as either something the project's own rules
              forbid, or a judgement you would make differently. Do not blur
              them; the second kind is advice and should read as advice.
            - Do NOT restate what the diff does. The author knows.
            - Do NOT propose anything on an agent's "what not to propose" list.
              Those are decisions on the record, and re-proposing them is the
              specific failure this review is written to avoid.
            - If you find nothing, say so in one line. A review that always
              finds something is one nobody reads.
            - End the comment with this line, exactly as written and on a
              line of its own, once the findings are in it:

                  Review complete at ${{ github.event.pull_request.head.sha }}

              The job checks for it and goes red without it, because a
              review that posts nothing must not read as one that found
              nothing. Post the findings even if delegating to an agent was
              refused — apply its checklist yourself, as above — and do not
              write the line on a comment that has no findings in it.

            You are reviewing. Do not edit files, do not push, do not resolve
            threads.

      # A SKIPPED job means the pull request is not labelled `ci-review`, which
      # is now the ordinary case and is visibly skipped rather than silently
      # green. Of the runs that do happen:
      #
      # THE REVIEW STEP'S SUCCESS IS NOT A REVIEW. The action exits SUCCESS
      # whenever the model stops without an error, whether or not it posted
      # anything. On PR #312 (run 34875692232) it stopped after 19 of its 40
      # turns, with five tool calls refused by the allow-list below, a
      # `success` result, and a sticky comment whose checklist ended at
      # "Delegate" — no findings, green check (#313 / AF-27). So a success
      # here is read against the pull request itself: the findings count as
      # posted only when a comment on it carries the closing line the prompt
      # asks for, naming this run's head commit. A sticky comment from an
      # earlier push names an earlier commit and does not count.
      #
      # FIVE OUTCOMES, and they are not the same: reviewed, not configured,
      # declined because this pull request edits the workflow, stopped without
      # posting, or the step did not finish. The action exits SUCCESS for the
      # middle three. The first three are green; the last two are red, because
      # a green check that reviewed nothing reads as approval and is not one.
      # Red is not a gate — `review` is not a required check, and this still
      # never blocks a merge. The tools the allow-list refused are named in
      # the summary on every outcome, because the log hides the model's
      # output and that list is the one account of why it stopped.
      #
      # CLAUDE.md states the rule this follows: anything non-fatal must report
      # where it can be read, because a silent step is an invisible one — the
      # lesson that cost the Parquet build three rounds. The run summary is
      # that place here, and it is written on every outcome, not just the bad
      # ones. `always()` because the unfinished case is the one most worth
      # naming.
      - name: Say which of the five happened
        if: always()
        env:
          ENABLED: ${{ steps.guard.outputs.enabled }}
          EDITED: ${{ steps.validation.outputs.edited }}
          OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          say() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          # Which tools the allow-list refused, from the result message the
          # action saved. Best effort: an unreadable file is said, not fatal.
          denied=""
          if [ -n "$EXECUTION_FILE" ] && [ -r "$EXECUTION_FILE" ]; then
            denied=$(jq -r '[.[]? | select(.type? == "result")] | last
              | (.permission_denials // []) | map(.tool_name) | unique
              | join(", ")' "$EXECUTION_FILE" 2>/dev/null) || denied="(the execution file could not be read)"
          fi
          say_denied() {
            if [ -n "$denied" ]; then
              say ""
              say "Tools the allow-list refused: $denied"
            fi
          }
          # Posted means a comment on the pull request carries the closing
          # line for THIS head commit. Backticks are stripped first, so a
          # line the model set as code still counts.
          posted=false
          if [ "$ENABLED" = "true" ] && [ "$EDITED" != "true" ] && [ "$OUTCOME" = "success" ]; then
            if bodies=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body'); then
              if printf '%s\n' "$bodies" | tr -d '`' | grep -Fq "Review complete at ${HEAD_SHA}"; then
                posted=true
              fi
            else
              say "### Not established — the pull request's comments could not be read"
              say ""
              say "The review step succeeded, but whether it posted findings is unknown. Read the sticky comment on the pull request."
              say_denied
              exit 1
            fi
          fi
          if [ "$ENABLED" != "true" ]; then
            say "### Not reviewed — no key is configured"
            say ""
            say "Set \`ANTHROPIC_API_KEY\` or \`CLAUDE_CODE_OAUTH_TOKEN\` under Settings, Secrets and variables, Actions."
          elif [ "$EDITED" = "true" ]; then
            say "### Not reviewed — this pull request edits \`review.yml\`"
            say ""
            say "The action reviews only when the workflow is byte-identical to the copy on the default branch, so that a pull request cannot rewrite the reviewer judging it. Nothing is wrong with this pull request; it simply reviewed nothing, and posted no comment. Read the diff yourself, and expect the review to resume on the next pull request that leaves this file alone."
          elif [ "$OUTCOME" = "success" ] && [ "$posted" = "true" ]; then
            say "### Reviewed"
            say ""
            say "The findings, or a line saying there were none, are in the sticky comment on the pull request, closed for \`${HEAD_SHA}\`."
            say_denied
          elif [ "$OUTCOME" = "success" ]; then
            say "### Not reviewed — the action succeeded and posted no findings"
            say ""
            say "No comment on this pull request ends with the closing line for \`${HEAD_SHA}\`, so the model stopped before it posted. This check is red on purpose: a green one here would read as a review that found nothing. It gates nothing; read the diff yourself, or push again for another run."
            say_denied
            exit 1
          else
            say "### The review did not finish — \`$OUTCOME\`"
            say ""
            say "The job log has the error."
            say_denied
          fi
