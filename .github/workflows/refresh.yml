name: refresh the harvest

# F1DB is the source for results, qualifying, standings, pit stops and the
# sprint classification, and it updates within a day or two of a race. The
# harvest files in this repository are a SNAPSHOT of it, so until somebody
# reruns the fetch tool the site keeps showing a race that has been run as
# still to come. That is the whole staleness problem, and it is a job for a
# schedule rather than for remembering.
#
# Every morning's run also stamps web/src/lib/refresh.js with the day it
# checked, and commits that one line even when nothing else moved (SD-25).
# Without it the only public freshness signal was the build date, which does
# not move on a quiet morning - so ten green runs and one dead pipeline looked
# identical from outside.
#
# Daily, just before 06:00 UTC. F1DB publishes within a day or two of a race,
# and a weekly poll against that has a failure mode with no recovery inside
# the period: miss it by four hours and the site says a race that has been run
# has not been run for eight days. The job's first real step is a diff that
# short-circuits everything after it, so a day with nothing new costs a
# checkout and a fetch. Also runnable by hand.
#
# Not on the hour. Scheduled workflows queue behind everyone else's, and the
# top of the hour is where everyone else's are: ten runs of this job at
# '0 6 * * *' started between 10:03 and 11:57 UTC, a mean of 4 h 52 m late,
# which is most of a day of staleness bought for nothing. GitHub's own advice
# for that is to pick a minute nobody else picked (AF-01).
#
# Every three hours at that minute, of which most runs stop in the `gate`
# job below having checked out three files. The run goes ahead when it is the
# day's first (LAST_CHECKED is not today, which is the daily check above and
# survives GitHub starting it hours late), when it is started by hand, or
# when a session of a race weekend began in the last 72 hours - read from
# the `sessions` table, which holds formula1.com's published start times. So
# the schedule follows the calendar without anyone editing it: from FP1 on
# Friday to the Monday after, the harvest is looked at eight times a day,
# and F1DB's release lands within three hours of it rather than by the next
# morning. A season with no timetable in `sessions` falls back to daily.
on:
  schedule:
    - cron: '47 2-23/3 * * *'
  workflow_dispatch:

# The workflow lands on the default branch on two paths, and they are not
# equally guarded because they are not equally risky. The refreshed HARVEST is
# committed when, and only when, the rebuilt database passes every check
# below. The dated check line is committed on the no-change path with no
# rebuild at all: nothing is built from it, the sed that writes it asserts its
# own result, and the web build gates it on every morning the harvest did
# move.
#
# Neither path pushes to main. main's branch protection requires ci.yml's
# four checks, admins included, and a push from here cannot carry them - from
# 2026-09-22 every run built, verified and was then refused (GH006). Both
# paths now open a pull request that merges itself once those checks pass
# (.github/scripts/land-refresh.sh, [D-45]), so a refresh is held to exactly
# what a person's change is. The pull request is opened with the refresh
# GitHub App's token, because GitHub starts no workflow from GITHUB_TOKEN's
# own pushes and the required checks would never report. The App needs
# Contents and Pull requests (read and write) on this repository; its id is
# the REFRESH_APP_ID variable and its key the REFRESH_APP_PRIVATE_KEY secret.
#
# No job that runs npm holds that token or that key (AF-78). Code from npm
# shares its job's working tree, .git and $GITHUB_ENV with every later step,
# so a token anywhere in the job is a token it can reach - by a git hook, a
# rewritten script, BASH_ENV or a url.insteadOf, whether or not checkout
# persisted it. So the work is three jobs. `gate` decides whether to run and
# checks that the App can still mint a token. `refresh` fetches, builds,
# verifies and tests with no token that writes, and packs what it changed
# before npm runs. `land` takes that pack, applies only what
# .github/scripts/refresh_tree.py allows a refresh to change, mints the token
# and opens the pull request - and runs nothing from npm.
#
# A fourth, `report`, says when any of that is going wrong (SD-35): it keeps
# one issue open while runs are failing and one while a race has gone
# unreported past its date. From 2026-10-02 sixteen runs failed in three days
# and nobody knew, because a failed scheduled run tells only whoever last
# touched the workflow.
permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            f1.db
            web/src/lib/refresh.js
            .github/scripts/refresh_gate.py
          sparse-checkout-cone-mode: false

      - name: Is this run worth doing?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/refresh_gate.py >> "$GITHUB_OUTPUT"

      # Before the build, so a missing or broken App fails the run in its
      # first minute rather than after three-quarters of an hour of it, and
      # the check date stops moving, which is the signal that date exists to
      # give. The token is used by nothing and revoked when this job ends;
      # `land` mints its own.
      - name: Can the App still mint a token?
        if: steps.decide.outputs.run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ci.yml budgets 10 for the Python half and 20 for the web half; a cold
    # npm ci alone has taken seven.
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # This job runs npm, so it holds no token that writes (AF-78, and the
      # header above): only the workflow's read-only GITHUB_TOKEN, and not
      # even that left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # PyYAML is needed by the fetch tool to read F1DB's source files. The
      # build itself has no dependencies and does not get any here. Pinned
      # in the file, which Dependabot bumps by pull request (AF-77): what it
      # installs runs before the pack below, so it is a choice.
      - name: Install the fetch tool's dependency
        run: pip install --quiet -r .github/requirements/refresh.txt

      - name: Fetch F1DB and rewrite the harvest
        run: python3 tools/f1db_fetch.py

      # F1DB's published career totals come from the release artefact, not
      # the clone, so they are a second fetch - of the release the step above
      # just stamped into harvest/f1db_drivers.txt, which is the tool's
      # default. verify.py holds a driver still racing to these totals and
      # fails when they are from another release than the harvest: a total
      # typed in, or pinned to an older release, goes stale with the driver's
      # next result, and from 2026-10-02 that stopped every run (CR-69).
      - name: Fetch F1DB's career totals for the same release
        run: python3 tools/f1db_totals_fetch.py

      - name: Has anything changed?
        id: diff
        run: |
          if git diff --quiet -- harvest/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The harvest already matches F1DB. Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- harvest/
          fi

      # THE HEARTBEAT (SD-25, absorbing SD-14). A morning that found nothing
      # new used to commit nothing, so no public surface moved: /changes went
      # on saying `Built <three weeks ago>` whether this job had run green
      # every day since or died on the first one. Those are different facts
      # and the second is the one worth knowing.
      #
      # Stamped here, after the fetch has succeeded and whether or not the
      # harvest moved, which is what makes a stale date mean something: a
      # morning that failed - as 2026-09-13 did, when verify.py refused the
      # chassis harvest - leaves the date where it was, and the reader sees
      # it stop. A stamp written on every attempt would report the pipeline
      # healthy right up to the point nobody could tell any more.
      #
      # The line is rewritten by sed and the rewrite asserted, exactly as
      # BUILT is below; web/test/conventions.mjs holds the shape of the line
      # to the shape matched here, so a reformat fails a pull request rather
      # than a morning. The resulting daily commit is also what keeps
      # GitHub's 60-day idle disable away from the schedule above.
      - name: Stamp the check
        run: |
          today=$(date -u +%Y-%m-%d)
          file=web/src/lib/refresh.js
          sed -i "s/^export const LAST_CHECKED = '.*'$/export const LAST_CHECKED = '${today}'/" "$file"
          grep -q "^export const LAST_CHECKED = '${today}'$" "$file" \
            || { echo "::error::LAST_CHECKED was not updated; has the line in ${file} changed shape?"; exit 1; }

      # THE GATE. A refresh is only worth having if it is still true. build.py
      # rebuilds from the new harvest and verify.py runs every check against
      # the result; a failure here stops the commit, so the repository keeps
      # the last harvest that was known good rather than taking on a broken
      # one unattended.
      # BUILT is a constant in build.py rather than a clock, so that the same
      # sources always rebuild to the same bytes — CI checks the committed
      # artefacts against a fresh build, and a rebuild that changed nothing
      # must not evict every reader's cached copy of a 20 MB file. The price is
      # that it has to be moved by hand, and it went four days stale that way.
      # This is the one moment the data genuinely changes, so this is where it
      # gets moved.
      - name: Date the build
        if: steps.diff.outputs.changed == 'true'
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i "s/^BUILT = \".*\"/BUILT = \"${today}\"/" build.py
          grep -q "^BUILT = \"${today}\"$" build.py \
            || { echo "::error::BUILT was not updated; has it moved or been renamed?"; exit 1; }

      - name: Rebuild and verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 build.py
          # The README's figures are spans written from the database and
          # checked by verify.py; a refresh that moved the build date or a
          # count without rewriting them would fail its own gate here.
          python3 tools/readme_figures.py --write
          python3 verify.py

      - name: Unit-test the loaders
        if: steps.diff.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests

      - name: Regenerate the JSON exports
        if: steps.diff.outputs.changed == 'true'
        run: python3 export_json.py --compat

      - name: Smoke-test the query tool
        if: steps.diff.outputs.changed == 'true'
        run: |
          ./f1 champions 2020 2025
          ./f1 gaps

      # THE HANDOVER (AF-78). Everything this job changed, packed for `land`
      # here, after the Python half has passed and before any npm code has
      # run, and uploaded at once. `land` downloads it by the id uploaded
      # here, not by name, so a later upload in this job is not what lands.
      # On a quiet morning the pack is the one dated line of refresh.js, and
      # on a later quiet run the same day, once that line is on main, it is
      # a paths.txt that lists nothing, which `land` applies as nothing and
      # whose `Commit the check` then finds already stamped (CR-78).
      # The pack refuses a change to any path a refresh does not write, so a
      # refresh that starts writing somewhere new fails here rather than
      # being dropped on the way across; `land` checks it all again.
      - name: Pack what the refresh changed
        run: python3 -B .github/scripts/refresh_tree.py pack "$RUNNER_TEMP/refresh"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh
          if-no-files-found: error
          retention-days: 1

      # ci.yml runs on the pull request `land` opens and gates its merge, so
      # this is no longer the only gate. It stays because it is the gate
      # BEFORE the pull request: a refresh the front end would refuse opens
      # nothing, rather than a pull request nobody is watching - `land` only
      # runs when every step of this job passed. This is the
      # front end's half: the build that puts the database on the site, and
      # the smoke test that reads its expectations out of that database.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test the site against the refreshed database
        if: steps.diff.outputs.changed == 'true'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm test
          # The two data-derived assertions ci.yml makes on the built site
          # that the smoke test does not: the site carries the database it
          # was built from, and the prerender is not the stub a failed query
          # leaves behind.
          gunzip -c dist/f1.db.gz | cmp - ../f1.db \
            || { echo "::error::dist/f1.db.gz does not decompress to the built database"; exit 1; }
          # Cloudflare will not host a single file over 25 MiB, and a deploy
          # carrying one fails whole - which the raw f1.db did once practice
          # took it to 30 MB, with every check here green (D-47).
          big=$(find dist -type f -size +26214400c)
          test -z "$big" || { echo "::error::over Cloudflare's 25 MiB per-file limit: $big"; exit 1; }
          # And its 20,000 files per deployment, which the static API (D-48)
          # brought within sight.
          files=$(find dist -type f | wc -l)
          test "$files" -le 20000 || { echo "::error::$files files in dist, over Cloudflare's 20,000"; exit 1; }
          urls=$(grep -c '<loc>' dist/sitemap.xml)
          test "$urls" -gt 2000 || { echo "::error::sitemap lists only $urls pages"; exit 1; }

  # The only job that holds the App's token, and it runs nothing from npm and
  # nothing from the pack: refresh_tree.py and land-refresh.sh come from this
  # job's own checkout of the commit `refresh` started from, and the pack is
  # data that refresh_tree.py checks before a byte of it is applied.
  land:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.refresh.outputs.artifact }}
          path: ${{ runner.temp }}/refresh

      - name: Apply what the refresh changed
        run: python3 -B .github/scripts/refresh_tree.py apply "$RUNNER_TEMP/refresh"

      - name: Did the harvest move?
        id: diff
        run: |
          if git diff --quiet -- harvest/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Last, so the token exists only for the two steps that use it. The
      # checkout above persisted no credential; land-refresh.sh hands the
      # token to its one push through gh.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      # The commit message names the F1DB version it came from, which the
      # harvest headers also carry, so the provenance of a row is answerable
      # from the log as well as from the file.
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          version=$(sed -n '2s/.*F1DB \(v[^ ]*\) (\([^)]*\)).*/\1 \2/p' harvest/race_results.txt)
          git add -A
          .github/scripts/land-refresh.sh "harvest: refresh from F1DB ${version}" \
            "Rebuilt and verified before committing; every check passed."

      # The no-change path's entire commit: one dated line. Cloudflare Workers
      # Builds runs on every push to main, so its merge is also what re-deploys
      # the site daily and so what keeps /build-status.txt - the deploy
      # heartbeat, written per deploy and never committed - from ageing
      # through a quiet week alongside everything else.
      #
      # Guarded on the file having actually moved, because a later run on the
      # same day - a race weekend's three-hourly look, or a workflow_dispatch -
      # finds it already stamped. No rebase and no retry: a pull request CI
      # refuses stays open, this date does not advance on main, and the next
      # run replaces it. That is the same signal a real failure gives, which
      # is the signal the date exists to carry - and `report` says so too,
      # since this run went green (SD-36).
      - name: Commit the check
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet -- web/src/lib/refresh.js; then
            echo "Already stamped with today's date. Nothing to commit."
            exit 0
          fi
          git add web/src/lib/refresh.js
          .github/scripts/land-refresh.sh "refresh: checked F1DB, nothing new" \
            "The harvest already matches F1DB. This records that the check ran."

  # SAYING SO (SD-35). Runs after the other three on every run that was not
  # cancelled - the gate's quick stops included - and holds the workflow's
  # own token with the three scopes it needs and nothing else: issues: write
  # to open, edit and close its two issues; actions: read to name the step
  # that failed, here or in ci.yml's run on the refresh's pull request; and
  # pull-requests: read to find that pull request, because a refresh CI
  # refuses leaves every run of this workflow green and the pull request
  # open, which said nothing until a race went late (SD-36). Never the App's
  # token, and nothing from npm or from the pack: it checks out four files
  # and runs two scripts from them.
  #
  # Two questions, two issues, each found by its label so a failure that
  # lasts a day is one issue rewritten eight times rather than eight issues:
  #   failure    did a job of this run fail, or is CI refusing the refresh's
  #              pull request? Opened on the first run that finds either,
  #              closed by the first after it whose `land` passes while CI
  #              is not refusing that pull request.
  #   freshness  is a race more than three days past its date with no
  #              result? Read from the committed f1.db and F1DB's calendar
  #              in the harvest, not from anything this run did, so it holds
  #              when the refresh is not running at all.
  # refresh_alarm.py and refresh_health.py say the rest.
  report:
    needs: [gate, refresh, land]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            f1.db
            harvest/race_dates.txt
            .github/scripts/refresh_alarm.py
            .github/scripts/refresh_health.py
          sparse-checkout-cone-mode: false

      - name: Did this run fail?
        env:
          GATE: ${{ needs.gate.result }}
          REFRESH: ${{ needs.refresh.result }}
          LAND: ${{ needs.land.result }}
        run: python3 -B .github/scripts/refresh_alarm.py failure

      # Even when the step above failed, so a broken issue write for one
      # question does not silence the other.
      - name: Is the data behind the calendar?
        if: ${{ !cancelled() }}
        run: python3 -B .github/scripts/refresh_alarm.py freshness
