name: build and verify

# The database is generated from data/*.py, so the build IS the test: if a
# data edit breaks a cross-check, verify.py exits 1 and this fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neither job writes anything back: they build the database, check it, and
# build the site. The workflow never declared this, so it took whatever the
# repository's default happened to be — which on a default of read-and-write
# hands a write-capable token to every push build that has no use for one.
permissions:
  contents: read

# One run per pull request, and the newest wins. Without this every push to
# an open pull request started four fresh jobs while the four it superseded
# ran to completion — and the backlog loop pushes review-fix commits onto an
# open pull request as a matter of course.
#
# WHY IT IS HERE NOW that the repository is public and the minutes are free:
# wall-clock on every pull request, runners held for work whose answer is
# already stale, and a cost that returns on a private fork or a change of
# plan. The measurement that prompted it is history rather than the standing
# reason — over the 24 hours before 2026-09-14, 55 runs of this workflow at
# about five billable minutes each, which with `review.yml` came to roughly
# 320 a day against the 2,000 a month a Free PRIVATE repository is allowed,
# and that is what exhausted the Actions allowance. (`review.yml`'s own
# failures are a Claude credential, a different allowance entirely; nothing
# here touches them.) `review.yml` has had a group since it was written;
# this file did not.
#
# CANCELLATION IS FOR PULL REQUESTS ONLY. A run on `main` is the gate: it
# rebuilds the database, compares the committed artefact against a fresh
# build, and `main` is what deploys to lapledger.org. Cancelling one would
# leave a deployed commit unverified, so `main` QUEUES instead — the group
# key falls back to `github.ref`, and `cancel-in-progress` is false for
# anything that is not a pull request.
#
# Queueing is not the same as running everything, and the difference is the
# one place this narrows coverage. GitHub holds at most ONE pending run per
# group: a third push arriving while one runs and one waits cancels the
# waiting one. Two pushes to `main` in quick succession both run; the middle
# of three would not, and that commit deploys without ever being verified.
# Reaching it takes three merges inside a single run, which `enforce_admins`
# and the strict up-to-date rule between them do not leave a normal path to
# — every merge invalidates the other open pull requests and forces a full
# cycle before the next can land. It is written down because it is the cost,
# not because it is likely.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Three linters, none of them a dependency of anything: Ruff for the
  # Python, Biome for the front end, actionlint (with ShellCheck, which the
  # runner image carries) for these workflow files. Each is installed here
  # and nowhere else — not in requirements.txt, not in web/package.json — so
  # the build stays stdlib-only and `npm ci` on Cloudflare installs nothing
  # for them. The rule sets and every rule left out are in ruff.toml and
  # web/biome.jsonc, each with its reason.
  #
  # A separate job so it runs beside `check` and `web` rather than in front
  # of them: it finishes in well under a minute and a lint failure should not
  # hide whether the build passed. Versions are pinned so a new release
  # cannot turn a pull request red on its own.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # `f1` has no .py extension; ruff.toml's `include` names it, so a bare
      # `ruff check` finds it. The GitHub output format puts each finding on
      # the pull request as an annotation.
      - name: Lint the Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.7"
          args: check --output-format github

      - uses: biomejs/setup-biome@v2
        with:
          version: "2.5.13"

      # Errors fail the job. Warnings — the rules web/biome.jsonc demotes,
      # filed as CR-29 — are printed and annotated but do not; the config
      # says why each one is a warning and how it goes back to being an
      # error.
      - name: Lint the front end
        working-directory: web
        run: biome lint --reporter=github

      # actionlint's own documented install: the pinned release binary,
      # fetched by its download script. It picks up the runner's shellcheck
      # and runs it over every `run:` block, which is most of the shell this
      # repository has.
      - name: Lint the workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  check:
    runs-on: ubuntu-latest
    # The build and every check run in well under a minute. A cap this far
    # above that never trips on a slow runner, and turns a hang into a failure
    # in minutes rather than letting it hold a runner for the default six
    # hours.
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # BEFORE the rebuild, because build.py overwrites f1.db and would
      # destroy the evidence. Six tables can hold timing data owned by
      # Formula One Management, loaded onto a local copy by tools/ and never
      # redistributable. This is the only moment a commit carrying them can
      # be caught: after the next step the file is a fresh build and clean by
      # construction. See LICENSE-DATA.
      - name: Check the committed database carries nothing unpublishable
        run: python3 verify.py --redistribution-only

      # No dependencies: everything but tools/fastf1_load.py is stdlib only.
      - name: Rebuild the database
        run: python3 build.py

      # verify.py checks the DATABASE. These check the CODE — the name
      # matching and the lap-closure arithmetic, whose mistakes have all been
      # found downstream until now — and, in tests/test_conventions.py, the
      # reviewer checklists' mechanical items: the build constant, the timing
      # switch, geometry column lists, both databases in every publishing
      # path. stdlib unittest, so the build still has no dependencies.
      - name: Unit-test the loaders
        run: python3 -m unittest discover -s tests -v

      - name: Verify
        run: python3 verify.py

      - name: Audit
        run: python3 audit.py

      - name: Regenerate the JSON exports
        run: python3 export_json.py --compat

      # A committed artefact that does not match its sources is a stale
      # artefact. Fail rather than let the two drift apart.
      #
      # f1_database.json is no longer committed — it is 21 MB, it does not
      # delta-compress, and it regenerates in a second — so there is nothing
      # there to go stale. f1_compat.json is 109 KB and is the v1 key layout
      # other things were written against, so it stays, and being able to see
      # it change in a diff is most of the reason why.
      - name: Check the committed artefacts are current
        run: |
          if ! git diff --quiet -- f1_compat.json; then
            echo "::error::The committed JSON export does not match a fresh build."
            echo "Run 'make all' and commit the result."
            git diff --stat -- f1_compat.json
            exit 1
          fi
          test -s f1_database.json || { echo "::error::the full export was not written"; exit 1; }

          # The two databases are byte-stable across rebuilds, so a difference
          # here means the committed copy is stale rather than that the build
          # is noisy. f1.db matters most during a multi-branch merge: git
          # cannot merge a 20 MB binary, the resolution is always to rebuild,
          # and without this a forgotten rebuild ships silently — every other
          # step runs against the database CI just rebuilt, not the one in the
          # commit.
          if ! git diff --quiet -- f1.db f1-geometry.db; then
            echo "::error::The committed databases do not match a fresh build."
            echo "Run 'python3 build.py' and commit the result."
            git diff --stat -- f1.db f1-geometry.db
            exit 1
          fi

      - name: Smoke-test the query tool
        run: |
          ./f1 champions 2020 2025
          ./f1 car mp4/4
          ./f1 circuit spa
          ./f1 gaps

  # The front end queries f1.db directly, so it has no tests of its own to run
  # against a fixture - but a build that does not compile, or a copy step that
  # cannot find the database, should fail here rather than on someone's laptop.
  web:
    runs-on: ubuntu-latest
    # Higher than `check` because this job installs npm packages and a browser.
    # A warm npm cache puts the whole job near a minute; a cold one has taken
    # seven, almost all of it in `npm ci`. Twenty leaves room for a cold cache
    # on a slow day without letting a wedged browser sit for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # prepare-assets.js stages four files. If any is missing the site loads
      # and then fails at the first query, which is exactly the failure that is
      # easy to ship. The gzip is checked by decompressing it and comparing
      # against the database it claims to be, because a stale or truncated .gz
      # is the one that opens as a corrupt database rather than as a 404.
      - name: Check the site carries the database and the engine
        working-directory: web
        run: |
          for f in f1.db f1.db.gz sql-wasm.wasm db-manifest.json; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          cmp ../f1.db dist/f1.db || { echo "::error::dist/f1.db is not the built database"; exit 1; }
          gunzip -c dist/f1.db.gz | cmp - ../f1.db \
            || { echo "::error::dist/f1.db.gz does not decompress to the built database"; exit 1; }

      # The static pages are the site's only crawlable surface, and they are
      # written by a script that never runs in a browser — so a failure here is
      # silent everywhere else. Check that a deep route became a real file, that
      # it carries its own title rather than the template's, and that the
      # sitemap is not the stub you get when a query returns nothing.
      - name: Check the site was prerendered
        working-directory: web
        run: |
          for f in index.html 404.html sitemap.xml robots.txt \
                   drivers/hamilton/index.html races/2021/10/index.html \
                   seasons/1950/index.html constructors/ferrari/index.html \
                   circuits/monza/index.html; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          grep -q '<title>Sir Lewis Hamilton' dist/drivers/hamilton/index.html \
            || { echo "::error::the prerendered driver page has no title of its own"; exit 1; }
          grep -q 'Silverstone' dist/races/2021/10/index.html \
            || { echo "::error::the prerendered race page carries no facts"; exit 1; }
          urls=$(grep -c '<loc>' dist/sitemap.xml)
          test "$urls" -gt 2000 \
            || { echo "::error::sitemap.xml lists only $urls URLs"; exit 1; }
          echo "prerendered, sitemap lists $urls URLs"

      # The Parquet step is non-fatal by design and reports to a file the
      # site serves; that file is read here, so a regression is visible in
      # CI and not only to somebody who fetches /build-status.txt.
      - name: Read the build status the Parquet step wrote
        working-directory: web
        run: |
          cat dist/build-status.txt
          grep -q '^result   ok' dist/build-status.txt \
            || { echo "::error::the Parquet bundle did not build; see build-status.txt above"; exit 1; }
          test -s dist/f1-parquet.zip || { echo "::error::dist/f1-parquet.zip is missing"; exit 1; }

      # The pure functions and the front end's conventions (the attribution
      # rule, declared zero fallbacks, the router), before a browser is
      # involved. node:test, so this adds no dependency either, and it runs in
      # under a second.
      - name: Unit-test the front end's pure functions
        working-directory: web
        run: npm run test:units

      # The browser download is the slowest step in this job on a warm npm
      # cache — Chromium is 150 MB and Playwright fetches it every run. Key
      # the cache on the Playwright version the lockfile actually installed,
      # so a bump in package-lock.json misses and downloads, and nothing
      # else does. The system libraries still come from apt each run:
      # `install-deps` is the half of `install --with-deps` that a cache
      # cannot carry.
      - name: Read the Playwright version npm installed
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        working-directory: web
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The build only proves the JavaScript compiles. This proves the worker
      # started, the gzip decompressed, SQLite instantiated, the queries
      # returned and the charts drew - and it checks the rendered counts
      # against f1.db itself, so it stays honest as the data grows. It also
      # asserts that a photograph renders its licence and its photographer,
      # which is a licence obligation rather than a style preference.
      - name: Drive the built site in a browser
        working-directory: web
        run: npm test
