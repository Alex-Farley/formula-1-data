name: deploy the site

# The front end is a static build that carries f1.db with it, so GitHub Pages
# can serve the whole thing: no server, no API, no database host. The build is
# gated on verify.py, because a site that ships a database which failed its own
# checks is worse than no site.
#
# NOT CURRENTLY LIVE. Pages needs the repository to be public, or the account
# to be on Pro or Team; this repository is private on Free, so the deploy step
# fails with "Resource not accessible by integration" — GITHUB_TOKEN cannot
# create a Pages site, and there is nothing here to fix if it could. The
# workflow is kept because it is correct and works the day either changes.
# Until then it is manual-only, so it does not fail on every push.
on:
  workflow_dispatch:

# Pages needs to write a deployment and mint an OIDC token to prove the
# artefact came from this workflow. Nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win: a queued deploy of an
# older commit is never the one anybody wants.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # A project Pages site lives under /<repo>/. vite's `base`, the router's
      # basename and the prerenderer's canonical URLs all read this one value,
      # so there is a single thing to change if the deploy path ever moves.
      SITE_BASE: /${{ github.event.repository.name }}/
      SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Rebuild from data/*.py rather than trusting the committed f1.db, and
      # refuse to deploy if it does not pass. The site is only as good as the
      # database it carries.
      - name: Rebuild the database
        run: python3 build.py

      - name: Verify
        run: python3 verify.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # The same check ci.yml makes: the site is useless without the database
      # and the engine beside it, and a truncated .gz is the failure that opens
      # as a corrupt database rather than as a 404.
      - name: Check the site carries the database and the engine
        working-directory: web
        run: |
          for f in f1.db.gz sql-wasm.wasm db-manifest.json; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          # Cloudflare will not host a single file over 25 MiB, and a deploy
          # carrying one fails whole - which the raw f1.db did once practice
          # took it to 30 MB, with every check here green (D-47).
          big=$(find dist -type f -size +26214400c)
          test -z "$big" || { echo "::error::over Cloudflare's 25 MiB per-file limit: $big"; exit 1; }
          # And its 20,000 files per deployment, which the static API (D-48)
          # brought within sight.
          files=$(find dist -type f | wc -l)
          test "$files" -le 20000 || { echo "::error::$files files in dist, over Cloudflare's 20,000"; exit 1; }
          gunzip -c dist/f1.db.gz | cmp - ../f1.db \
            || { echo "::error::dist/f1.db.gz does not decompress to the built database"; exit 1; }

      # Pages serves this at https://<user>.github.io/<repo>/, not at a domain
      # root, so the asset paths and the router's basename have to be told. Both
      # read SITE_BASE; prerender.js reads it too, for the canonical URLs and
      # the sitemap.
      #
      # This is why the step order matters: SITE_BASE has to be set for the
      # build above, not here. It is set at the job level instead — see `env` at
      # the top of this job.

      # Jekyll would otherwise drop files and directories beginning with an
      # underscore. Vite does not emit any today, but the failure is silent and
      # the fix is one file.
      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      # enablement asks GitHub to turn Pages on if it is off. GITHUB_TOKEN is
      # not allowed to create a Pages site, so on a repository that has never
      # had one this fails rather than fixing it; it succeeds once Pages has
      # been enabled by hand under Settings, which is the case this is for.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
