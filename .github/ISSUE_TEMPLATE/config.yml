# Two forms, and no blank issue.
#
# item.yml is the queue: it asks for the three things an item needs, and
# CONTRIBUTING.md, *The queue*, is the rule for them. report.yml is a
# reader's report of something wrong on the site, which is NOT a queue item
# and is not asked for an id, a size or a board column - SD-04, and the
# reason the two forms exist rather than one.
blank_issues_enabled: false
contact_links:
  - name: How the queue works
    url: https://github.com/Alex-Farley/formula-1-data/blob/main/CONTRIBUTING.md#the-queue
    about: Ids, prefixes, sizes, status, how an item lands or is declined.
  - name: The board
    url: https://github.com/users/Alex-Farley/projects/1
    about: Now, Next, Someday — drag to rank.
