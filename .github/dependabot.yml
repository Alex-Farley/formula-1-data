# Dependabot: version bumps as pull requests, monthly, grouped.
#
# Three ecosystems. The actions these workflows `use`, each pinned to a
# commit SHA with its release in a trailing comment (AF-77), because a tag
# is something the action's owner can move; Dependabot moves the SHA and
# the comment together. web/package.json, whose devDependencies include the
# bundler and the browser driver the site is built and tested with. And
# the two packages workflows install with pip, pinned in
# .github/requirements/ - one in the job holding the refresh App's token,
# one in the job holding contents: write. Not requirements.txt at the root:
# that is one optional range (`fastf1>=3.8`) for a tool that never runs in
# CI, and there is nothing there to pin.
#
# Every pull request this opens runs ci.yml — the build, the artefact
# comparison, the site build and the browser test — so a bump that breaks
# the deploy chain is red before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: monthly
    groups:
      workflow-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    # One pull request for the toolchain, one for the runtime, so a Vite
    # major and a React patch are not the same decision.
    groups:
      build-and-test:
        dependency-type: development
      runtime:
        dependency-type: production
