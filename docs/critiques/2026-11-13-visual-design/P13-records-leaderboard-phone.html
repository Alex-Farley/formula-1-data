<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Records: the leaderboard on a phone - mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="mock.css">
<script>if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark'</script>
<style>
.lb { display: grid; grid-template-columns: 11rem 1fr; gap: var(--space-3) var(--space-6); align-items: center; font: var(--size-4)/1.2 var(--sans); }
.lb .n { text-align: right; color: var(--ink-soft); }
.lb .b { display: flex; align-items: center; gap: var(--space-4); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; font-size: var(--size-3); }
.lb .b i { display: block; height: var(--space-6); background: var(--series-ink); }
.lb .top .b i, .lb .b.top i { background: var(--series-mark); }
.lb .gapnote { font: var(--weight-medium) var(--size-3)/1 var(--sans); color: var(--ink); margin-left: var(--space-4); }
@media (width < 768px) {
  .lb { grid-template-columns: 1fr; gap: 0; }
  .lb .n { text-align: left; color: var(--ink); margin-top: var(--space-4); margin-bottom: var(--space-2); }
  .lb .b i { height: var(--space-5); }
}
</style>
</head><body>
